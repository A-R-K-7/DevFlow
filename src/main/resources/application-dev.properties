# ===================================================================
# DevFlow - Development Profile (H2 In-Memory Database)
# ===================================================================
# Activate this profile with: --spring.profiles.active=dev

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:devflow_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Debug Logging
logging.level.com.devflow=DEBUG
logging.level.org.springframework.security=DEBUG
